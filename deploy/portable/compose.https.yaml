# Opt-in TLS termination; requires DOMAIN in .runtime/compose.env and public DNS.
services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    platform: linux/amd64
    environment:
      DOCLENS_DOMAIN: ${DOMAIN:?Configure a public DNS hostname first}
      NO_PROXY: frontend,localhost,127.0.0.1
      no_proxy: frontend,localhost,127.0.0.1
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    networks: [edge]
    depends_on:
      frontend: {condition: service_healthy}
    restart: unless-stopped
volumes:
  tls-data: {}
  tls-config: {}
