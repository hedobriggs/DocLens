# Optional overlay: docker compose -f compose.yaml -f compose.monitoring.yaml up -d --build --wait
services:
  frontend:
    environment:
      DOCLENS_MONITORING: "1"
      NO_PROXY: backend,qdrant,prometheus,grafana,localhost,127.0.0.1
      no_proxy: backend,qdrant,prometheus,grafana,localhost,127.0.0.1
    networks: [edge, monitoring]
  prometheus:
    image: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    platform: linux/amd64
    command:
      - --config.file=/etc/prometheus/doclens.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=256MB
      - --storage.tsdb.wal-compression
      - --query.max-concurrency=4
      - --query.max-samples=500000
      - --query.timeout=10s
      - --web.external-url=/prometheus/
      - --web.route-prefix=/
    environment:
      GOMEMLIMIT: 192MiB
      NO_PROXY: backend,qdrant,prometheus,grafana,localhost,127.0.0.1
      no_proxy: backend,qdrant,prometheus,grafana,localhost,127.0.0.1
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/doclens.yml:ro
      - prometheus:/prometheus
    networks: [data, monitoring]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    restart: unless-stopped
  grafana:
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    platform: linux/amd64
    environment:
      NO_PROXY: backend,qdrant,prometheus,grafana,localhost,127.0.0.1
      no_proxy: backend,qdrant,prometheus,grafana,localhost,127.0.0.1
      GF_PATHS_BUNDLED_PLUGINS: /usr/share/grafana/data/plugins-bundled
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_LOG_MODE: console
      GF_SERVER_HTTP_PORT: "3001"
      GF_SERVER_ROOT_URL: /monitoring/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-DocLens-Grafana-User
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PATHS_PROVISIONING: /opt/monitoring/provisioning
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /opt/monitoring/dashboards/doclens.json
      GOMEMLIMIT: 256MiB
    # Start with an unknown password, never the vendor's admin/admin default.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        if [ ! -e /var/lib/grafana/secret-key ]; then
          if [ -e /var/lib/grafana/grafana.db ]; then
            echo "Restore the matching Grafana encryption key; existing database preserved" >&2
            exit 1
          fi
          key_tmp="$$(mktemp /var/lib/grafana/.secret-key.XXXXXX)"
          head -c 48 /dev/urandom | base64 > "$$key_tmp"
          mv "$$key_tmp" /var/lib/grafana/secret-key
        fi
        test -s /var/lib/grafana/secret-key
        export GF_SECURITY_SECRET_KEY="$$(cat /var/lib/grafana/secret-key)"
        export GF_SECURITY_ADMIN_PASSWORD="$$(head -c 48 /dev/urandom | base64)"
        exec /usr/share/grafana/bin/grafana server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini
    volumes:
      - grafana:/var/lib/grafana
      - ./deploy/monitoring/provisioning:/opt/monitoring/provisioning:ro
      - ./deploy/monitoring/dashboards/doclens.json:/opt/monitoring/dashboards/doclens.json:ro
    networks: [monitoring]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/busybox, wget, -q, -O, /dev/null, http://127.0.0.1:3001/monitoring/api/health]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    restart: unless-stopped
volumes:
  prometheus: {}
  grafana: {}
networks:
  monitoring: {internal: true}
