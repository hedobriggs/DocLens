services:
  backend:
    build:
      context: ./backend
    container_name: doclens-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - qdrant_data:/app/qdrant_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: doclens-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
