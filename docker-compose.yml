
services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: doclens-qdrant
    volumes:
      - qdrant_server_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: doclens-backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    cpus: 2.0
    mem_limit: 1536m
    memswap_limit: 1536m
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
      - ./.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DOCLENS_INFERENCE_THREADS: "2"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: doclens-frontend
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: doclens-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: doclens-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/doclens.json:/etc/grafana/dashboards/doclens.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  qdrant_server_data:
  prometheus_data:
  grafana_data:

