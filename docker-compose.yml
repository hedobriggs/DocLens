
services:
  backend:
    build:
      context: ./backend
    container_name: doclens-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
      - ./.env
    volumes:
      - qdrant_data:/app/qdrant_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: doclens-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: doclens-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: doclens-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards/details:ro
      - ./monitoring/grafana/doclens.json:/etc/grafana/dashboards/doclens.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  grafana-permissions:
    image: python:3.12-alpine
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/admin_permissions.py:/admin_permissions.py:ro
    command: ["python", "/admin_permissions.py"]
    depends_on:
      - grafana
    restart: on-failure

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  qdrant_data:
  prometheus_data:
  grafana_data:

